<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <script>
        async function getPlayers() {

            try {
                const response = await fetch('http://127.0.0.1:8000/players', {

                    headers: {
                        'Content-Type': 'application/json',
                        token: localStorage.getItem('token')
                    },

                });
                const data = await response.json();
                if (response.status === 200) {
                    const list = document.getElementById("LIST")

                    for (let i = 0; i < data.length; i++) {
                        const player = data[i]
                        const playerCard = ` <div class="card" style="width: 18rem;">
                                        <img src="${player.profile_image}" class="card-img-top" alt="...">
                                        <div class="card-body">
                                            <h5 class="card-title">${player.name}</h5>
                                            <p class="card-text">Phone : ${player.phone} Email : ${player.email} Playing For : ${player.playing_for}</p>
                                            <a href="player_stats.html?id=${player._id}" class="btn btn-primary">Player Stats</a>
                                        </div>
                                        </div>`
                        list.innerHTML = list.innerHTML + playerCard
                    }

                } else {
                    document.getElementById('response').textContent = `Bad Request (400): ${JSON.stringify(data)}`;
                }
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }

        getPlayers()
    </script>

</head>

<body>
    <h1> Players List</h1>

    <div id="LIST">



    </div>

    <p id="response"></p>

</body>

</html>
