<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <script>

        async function updateTeamInfo(){

            const teamId= document.getElementById("TEAM_ID").value

             try {
                const response = await fetch(`http://127.0.0.1:8000/users/teams/${teamId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        token: localStorage.getItem('token')
                    },
                    body: JSON.stringify({ name:document.getElementById("TEAM_NAME").value,
                        image:document.getElementById("TEAM_IMAGE").value,
                        state:document.getElementById("STATE_NAME").value,
                        color:document.getElementById("COLOR").value,
                                                id:document.getElementById("TEAM_ID").value

                     })

                });
                const data = await response.json();
                if (response.status === 200) {

                    document.getElementById("response").innerHTML = "UPDATED"

                } else {
                    document.getElementById('response').textContent = `Bad Request (400): ${JSON.stringify(data)}`;
                }
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }


        }

        async function getTeam() {

            try {
                const response = await fetch('http://127.0.0.1:8000/users/teams', {

                    headers: {
                        'Content-Type': 'application/json',
                        token: localStorage.getItem('token')
                    },

                });
                const data = await response.json();
                if (response.status === 200) {

                    document.getElementById("TEAM_INFO").innerHTML = `
                    
                    <h1 id="TEAM_TITLE">Your Team</h1>
                    <img src="${data.image}" class="card-img-top" alt="Team Image" style="height: 200px; object-fit: cover;">
                    
                    <input type="hidden" value=${data._id} class="form-control" id="TEAM_ID" placeholder="Team Id">

                    <div class="form-floating mb-3">
                        <input type="text" value=${data.image} class="form-control" id="TEAM_IMAGE" placeholder="Image">
                        <label for="floatingInput">Image</label>
                    </div>
                    
                    <div class="form-floating mb-3">
                        <input type="text" value=${data.name} class="form-control" id="TEAM_NAME" placeholder="Team">
                        <label for="floatingInput">Team</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" value=${data.state} class="form-control" id="STATE_NAME" placeholder="State">
                        <label for="floatingInput">State</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" value=${data.color} class="form-control" id="COLOR" placeholder="Color">
                        <label for="floatingInput">COLOR</label>
                    </div>
                    
                    <button class="btn btn-primary" onclick="updateTeamInfo()">update</button>
                    
                    `


                } else {
                    document.getElementById('response').textContent = `Bad Request (400): ${JSON.stringify(data)}`;
                }
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }

        getTeam()
    </script>
</head>

<body>

    <p id="response"></p>

    <p id="TEAM_INFO"></p>


</body>

</html>
