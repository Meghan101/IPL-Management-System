<!-- player_stats.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Player Stats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function getPlayerStats() {
            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('id');

            if (!playerId) {
                document.getElementById('response').textContent = 'Player ID not found in URL';
            } else {

                try {
                    const response = await fetch(`http://127.0.0.1:8000/players/${playerId}/stats`, {
                        headers: {
                            'Content-Type': 'application/json',
                            token: localStorage.getItem('token')
                        }
                    });

                    const player = await response.json();
                    if (response.status === 200) {
                        const list = document.getElementById("LIST");
                        const playerStatsCard = `
                <div class="card shadow-lg border-0 rounded m-4" style="width: 22rem;">
                    <img src="${player.profile_image}" class="card-img-top" alt="Player Image" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                    <h4 class="card-title text-primary text-center">${player.name}</h4>
                    <hr>
                    <ul class="list-group mb-3">
                        <li class="list-group-item"><strong>Phone:</strong> ${player.phone}</li>
                        <li class="list-group-item"><strong>Email:</strong> ${player.email}</li>
                        <li class="list-group-item"><strong>Playing For:</strong> ${player.playing_for}</li>
                    </ul>
                    <div class="bg-light p-3 rounded">
                        <h6 class="text-secondary text-center mb-2">Performance Stats</h6>
                        <p class="mb-1"><strong>Total Runs:</strong> ${player.stats.runs || 0}</p>
                        <p class="mb-1"><strong>Total Fours:</strong> ${player.stats.fours || 0}</p>
                        <p class="mb-0"><strong>Total Sixes:</strong> ${player.stats.sixes || 0}</p>
                        <p class="mb-0"><strong>Total Wickets:</strong> ${player.stats.wickets || 0}</p>
                        <p class="mb-0"><strong>Total Catches:</strong> ${player.stats.catches || 0}</p>

                    </div>
                    </div>
                </div>`;
                        list.innerHTML = playerStatsCard;
                    } else {
                        document.getElementById('response').textContent = `Error: ${JSON.stringify(player)}`;
                    }
                } catch (error) {
                    document.getElementById('response').textContent = 'Error: ' + error.message;
                }

            }


        }

        getPlayerStats();
    </script>
</head>

<body>
    <h1 class="text-center">Player Stats</h1>
    <div class="container" id="LIST"></div>
    <p id="response"></p>
</body>

</html>
