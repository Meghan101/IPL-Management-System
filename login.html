<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
            <h2 class="card-title text-center mb-4">Login</h2>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                <button class="btn btn-primary w-100 me-md-2" onclick="login()">Login</button>
                <a href="../IMS-FE/signup.html" class="btn btn-outline-secondary w-100">Create Account</a>
            </div>

            <div id="response" class="mt-3 text-center text-danger"></div>
        </div>
    </div>


    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/tokens', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.status === 200) {
                    localStorage.setItem("token", data.token);
                    window.location.href = "dashboard.html"
                } else {
                    document.getElementById('response').textContent = `Bad Request (400): ${JSON.stringify(data)}`;
                }
            } catch (error) {
                document.getElementById('response').textContent = 'Error: ' + error.message;
            }
        }
    </script>

</body>

</html>
