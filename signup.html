<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup pGae</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>

        function createAccount() {

            console.log("calling")

            const input_name = document.getElementById("NAME").value
            const input_email = document.getElementById("EMAIL").value
            const input_phone = document.getElementById("PHONE").value
            const input_password = document.getElementById("PASSWORD").value


            fetch("http://127.0.0.1:8000/users", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name:input_name,
                    email:input_email,
                    phone:input_phone,
                    password:input_password
                })
            }).then((res)=>res.json()).then((res)=>{

                document.getElementById("RESPONSE").innerHTML=JSON.stringify(res)

            })

        }


    </script>

</head>

<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 450px;">
      <h2 class="card-title text-center mb-4">Create Account</h2>
      
      <div class="mb-3">
        <input id="NAME" type="text" class="form-control" placeholder="Enter Your Name" required>
      </div>

      <div class="mb-3">
        <input id="EMAIL" type="email" class="form-control" placeholder="Enter Your Email" required>
      </div>

      <div class="mb-3">
        <input id="PHONE" type="number" class="form-control" placeholder="Enter Your Phone" required>
      </div>

      <div class="mb-3">
        <input id="PASSWORD" type="password" class="form-control" placeholder="Enter Your Password" required>
      </div>

      <button class="btn btn-success w-100" onclick="createAccount()">Create Account</button>

      <p id="RESPONSE" class="mt-3 text-center text-danger"></p>
    </div>
  </div>

</body>

</html>
